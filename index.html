  <script type="text/babel" data-type="module" data-presets="react">

    const inverterLibrary = [
      { model: "1.0kW", phase: 1, maxDc: 1300, ratedAc: 1000, efficiency: 0.973 },
      { model: "1.5kW", phase: 1, maxDc: 2000, ratedAc: 1500, efficiency: 0.973 },

      { model: "8.0kW", phase: 3, maxDc: 12000, ratedAc: 8000, efficiency: 0.983 },
      { model: "9.0kW", phase: 3, maxDc: 13500, ratedAc: 9000, efficiency: 0.983 },
      { model: "10.0kW", phase: 3, maxDc: 15000, ratedAc: 10000, efficiency: 0.983 },
      { model: "12.0kW", phase: 3, maxDc: 18000, ratedAc: 12000, efficiency: 0.983 },

      { model: "22.0kW", phase: 3, maxDc: 28600, ratedAc: 22000, efficiency: 0.985 },
      { model: "23.0kW", phase: 3, maxDc: 29900, ratedAc: 23000, efficiency: 0.985 },
      { model: "25.0kW", phase: 3, maxDc: 32500, ratedAc: 25000, efficiency: 0.985 },
      { model: "30.0kW", phase: 3, maxDc: 39000, ratedAc: 30000, efficiency: 0.986 },
    ];

    function SolarConfigurator() {
      const [panelCount, setPanelCount] = useState("10");
      const [phaseFilter, setPhaseFilter] = useState("all");
      const PANEL_WATTAGE = 620;

      const pdc = useMemo(() => (parseInt(panelCount) || 0) * PANEL_WATTAGE, [panelCount]);

      const filteredInverters = useMemo(() => {
        return inverterLibrary
          .filter((inv) => {
            const isCompatible = pdc <= inv.maxDc;
            const isUnderpowered = pdc < inv.ratedAc * 0.5;
            const phaseMatch = phaseFilter === "all" || inv.phase === phaseFilter;
            return phaseMatch && isCompatible && !isUnderpowered;
          })
          .sort((a, b) => a.maxDc - b.maxDc);
      }, [pdc, phaseFilter]);

      return (
        <div className="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
          <div className="bg-emerald-900 p-6 text-white">
            <div className="flex items-center gap-3 mb-2">
              <Zap className="h-6 w-6 text-yellow-400" />
              <h2 className="text-2xl font-bold">Solar Configurator</h2>
            </div>
            <p className="text-emerald-100 text-sm">Select your system size to find compatible inverters.</p>
          </div>

          <div className="p-6 space-y-8">
            <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div className="space-y-1">
                  <label htmlFor="panel-count" className="block text-sm font-semibold text-slate-700 uppercase tracking-wider">
                    Number of 620Wp Panels
                  </label>
                  <div className="flex items-center gap-4">
                    <input
                      id="panel-count"
                      type="number"
                      min="0"
                      max="100"
                      value={panelCount}
                      onChange={(e) => {
                        let val = e.target.value;
                        if (val.length > 1 && val.startsWith("0")) {
                          val = val.replace(/^0+/, "");
                        }
                        if (val === "" || (/^\d+$/.test(val) && parseInt(val) <= 100)) {
                          setPanelCount(val);
                        }
                      }}
                      onFocus={() => {
                        if (panelCount === "0") setPanelCount("");
                      }}
                      onBlur={() => {
                        if (panelCount === "") setPanelCount("0");
                      }}
                      className="w-32 px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none font-bold text-lg"
                    />
                    <span className="text-slate-400 font-medium">× 620Wp</span>
                  </div>
                </div>

                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                  <div className="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center">
                    <Zap className="h-6 w-6 text-emerald-600" />
                  </div>
                  <div>
                    <div className="text-xs text-slate-500 font-bold uppercase tracking-tight">Total DC Power</div>
                    <div className="text-2xl font-black text-slate-900">
                      {(pdc / 1000).toFixed(2)} <span className="text-sm font-bold text-slate-400">kWp</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div className="space-y-6">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <h3 className="font-bold text-slate-800 flex items-center gap-2">
                  Recommended Inverters
                  <span className="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full">
                    {filteredInverters.length} Found
                  </span>
                </h3>

                <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                  {["all", 1, 3].map((p) => (
                    <button
                      key={p}
                      onClick={() => setPhaseFilter(p)}
                      className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        phaseFilter === p ? "bg-white text-emerald-700 shadow-sm" : "text-slate-500 hover:text-slate-700"
                      }`}
                    >
                      {p === "all" ? "All Phases" : `${p} Phase`}
                    </button>
                  ))}
                </div>
              </div>

              {filteredInverters.length > 0 ? (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredInverters.map((inv, idx) => {
                    const loadPercentage = Math.min(100, (pdc / inv.maxDc) * 100);
                    return (
                      <div
                        key={`${inv.model}-${idx}`}
                        className="relative p-5 rounded-2xl border bg-white border-slate-200 hover:border-emerald-500 hover:shadow-lg transition-all duration-300"
                      >
                        <div className="flex justify-between items-start mb-4">
                          <div>
                            <div className="text-lg font-black text-slate-900">{inv.model}</div>
                            <div className="text-xs font-bold text-slate-400 uppercase tracking-widest">
                              {inv.phase} Phase Inverter
                            </div>
                          </div>
                          <CheckCircle2 className="h-5 w-5 text-emerald-500" />
                        </div>

                        <div className="space-y-3">
                          <div className="flex justify-between text-xs font-bold">
                            <span className="text-slate-500 uppercase">Load Capacity</span>
                            <span className="text-emerald-600">{loadPercentage.toFixed(1)}%</span>
                          </div>

                          <div className="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                            <div
                              className={`h-full transition-all duration-500 ${
                                loadPercentage > 90 ? "bg-orange-400" : "bg-emerald-500"
                              }`}
                              style={{ width: `${loadPercentage}%` }}
                            />
                          </div>

                          <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-50">
                            <div className="text-[10px] text-slate-400 font-bold uppercase">Max DC Input</div>
                            <div className="text-[10px] text-slate-400 font-bold uppercase text-right">AC Rating</div>
                            <div className="text-xs font-bold text-slate-700">{inv.maxDc}W</div>
                            <div className="text-xs font-bold text-slate-700 text-right">{inv.ratedAc}W</div>
                          </div>

                          <div className="flex items-center justify-between pt-2">
                            <span className="text-[10px] text-slate-400 font-bold uppercase">Efficiency</span>
                            <span className="text-xs font-bold text-emerald-600">{(inv.efficiency * 100).toFixed(1)}%</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div className="bg-slate-50 border border-dashed border-slate-200 rounded-2xl p-12 text-center">
                  <AlertCircle className="h-12 w-12 text-slate-300 mx-auto mb-4" />
                  <h4 className="text-lg font-bold text-slate-600 mb-2">No Matching Inverters</h4>
                  <p className="text-slate-400 text-sm max-w-xs mx-auto">
                    Try adjusting your panel count or changing the phase filter to find compatible options.
                  </p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ---------------------------------------------------------------- */
    /* ChatBot                                                            */
    /* ---------------------------------------------------------------- */

    function ChatBot() {
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { role: "bot", text: "Hello! I am your Sarawak Solar assistant. How can I help you with the 2026 NEM subsidy today?" },
      ]);
      const [userInput, setUserInput] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chatMessages]);

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!userInput.trim()) return;

        const userMsg = userInput;
        setUserInput("");
        setChatMessages((prev) => [...prev, { role: "user", text: userMsg }]);
        setIsTyping(true);

        try {
          const ai = new GoogleGenAI({ apiKey: window.GEMINI_API_KEY || "" });
          const response = await ai.models.generateContent({
            model: "gemini-3-flash-preview",
            contents: [{ parts: [{ text: userMsg }] }],
            config: {
              systemInstruction: `You are a helpful solar energy consultant for SarawakSolar.com. You are helping a customer in Sarawak, Malaysia.
              Context:
              - 2026 Sarawak Energy NEM Subsidy is active.
              - Subsidies: RM8k (2-3.5kW), RM10k (3.5-6kW), RM12k (6-50kW).
              - Benefits: 1:1 energy offset, 15-year SEB contract.
              - Requirements: SEB Registered Contractor, SET-P compliance.
              Answer the following question briefly and professionally. If you don't know the answer, suggest they contact us via WhatsApp at +60102841069.`,
            },
          });

          setChatMessages((prev) => [...prev, { role: "bot", text: response.text || "I'm sorry, I couldn't generate a response." }]);
        } catch (error) {
          console.error("Chat error:", error);
          setChatMessages((prev) => [
            ...prev,
            { role: "bot", text: "I'm sorry, I'm having trouble connecting. Please try again or contact us via WhatsApp!" },
          ]);
        } finally {
          setIsTyping(false);
        }
      };

      return (
        <div className="fixed bottom-6 right-6 z-[60] flex flex-col items-end">
          {isChatOpen && (
            <div className="bg-white w-[350px] h-[500px] rounded-3xl shadow-2xl border border-slate-100 flex flex-col overflow-hidden mb-4 animate-in slide-in-from-bottom-4 duration-300">
              <div className="bg-emerald-900 p-4 flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-emerald-800 flex items-center justify-center">
                    <Bot className="h-6 w-6 text-yellow-400" />
                  </div>
                  <div>
                    <div className="text-white font-bold text-sm">Solar Assistant</div>
                    <div className="text-emerald-300 text-xs flex items-center gap-1">
                      <div className="w-2 h-2 rounded-full bg-green-400"></div>
                      Online
                    </div>
                  </div>
                </div>
                <button onClick={() => setIsChatOpen(false)} className="text-emerald-300 hover:text-white">
                  <X className="h-6 w-6" />
                </button>
              </div>

              <div className="flex-grow overflow-y-auto p-4 space-y-4 bg-slate-50">
                {chatMessages.map((msg, i) => (
                  <div key={i} className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}>
                    <div
                      className={`max-w-[80%] p-3 rounded-2xl text-sm ${
                        msg.role === "user"
                          ? "bg-emerald-900 text-white rounded-tr-none"
                          : "bg-white text-slate-700 shadow-sm border border-slate-100 rounded-tl-none"
                      }`}
                    >
                      {msg.text}
                    </div>
                  </div>
                ))}
                {isTyping && (
                  <div className="flex justify-start">
                    <div className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 rounded-tl-none flex gap-1">
                      <div className="w-1.5 h-1.5 bg-slate-300 rounded-full animate-bounce"></div>
                      <div className="w-1.5 h-1.5 bg-slate-300 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                      <div className="w-1.5 h-1.5 bg-slate-300 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                    </div>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              <form onSubmit={handleSendMessage} className="p-4 bg-white border-t border-slate-100 flex gap-2">
                <input
                  type="text"
                  value={userInput}
                  onChange={(e) => setUserInput(e.target.value)}
                  placeholder="Ask about subsidies..."
                  className="flex-grow px-4 py-2 rounded-full bg-slate-100 border-none focus:ring-2 focus:ring-emerald-500 text-sm outline-none"
                />
                <button type="submit" className="bg-emerald-900 text-white p-2 rounded-full hover:bg-emerald-800 transition-colors">
                  <Send className="h-5 w-5" />
                </button>
              </form>
            </div>
          )}

          <div className="flex gap-4">
            <a
              href="https://wa.me/60102841069"
              target="_blank"
              rel="noopener noreferrer"
              className="bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center justify-center group"
              aria-label="Chat on WhatsApp"
            >
              <MessageCircle className="h-8 w-8" />
            </a>

            <button
              onClick={() => setIsChatOpen(!isChatOpen)}
              className="bg-emerald-900 text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center justify-center relative"
              aria-label="Open Chat"
            >
              {isChatOpen ? <X className="h-8 w-8" /> : <Bot className="h-8 w-8" />}
              {!isChatOpen && (
                <span className="absolute -top-1 -right-1 flex h-5 w-5">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-5 w-5 bg-yellow-500 border-2 border-white"></span>
                </span>
              )}
            </button>
          </div>
        </div>
      );
    }

    /* ---------------------------------------------------------------- */
    /* App                                                                */
    /* ---------------------------------------------------------------- */

    function App() {
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
      const [selectedNews, setSelectedNews] = useState(null);

      useEffect(() => {
        const targetDate = new Date("2026-12-31T23:59:59").getTime();
        const timer = setInterval(() => {
          const now = new Date().getTime();
          const distance = targetDate - now;
          if (distance < 0) {
            clearInterval(timer);
          } else {
            setTimeLeft({
              days: Math.floor(distance / (1000 * 60 * 60 * 24)),
              hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
              minutes: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
              seconds: Math.floor((distance % (1000 * 60)) / 1000),
            });
          }
        }, 1000);
        return () => clearInterval(timer);
      }, []);

        setIsMenuOpen(false);

        },
        {
          date: "March 1, 2025",
          title: "New Solar Panel Standards for Sarawak Residential Installations",
          summary:

            "The Ministry of Utility and Telecommunication Sarawak, in collaboration with Sarawak Energy, has introduced updated technical standards for residential solar panel installations under the Sarawak Energy Transition Policy (SET-P). These new guidelines focus on enhancing the safety, efficiency, and durability of solar systems in Sarawak's tropical climate.\n\nKey updates include mandatory Tier-1 panel certification, specific mounting requirements to withstand high wind speeds during monsoon seasons, and the integration of smart inverters capable of grid stabilization. The policy also emphasizes the importance of using SEB-registered contractors to ensure that all installations meet the rigorous safety criteria required for grid connection.\n\nThese standards are designed to protect consumers' investments and ensure that residential solar systems contribute effectively to the state's long-term energy security goals.",
          link: "https://www.theborneopost.com/tag/solar-energy/",
        },
      ];

      return (
